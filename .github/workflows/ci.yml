name: CI/CD

# Se dispara en cada push o pull request hacia main y Develop.
# El deploy a producción solo ocurre en pushes a main (ver job `deploy`).
on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]

jobs:
  # ---------------------------------------------------------------------------
  # Job de calidad: lint -> tests unitarios -> tests E2E -> build.
  # Los pasos corren en orden; si uno falla, los siguientes no se ejecutan y el
  # job queda en rojo, bloqueando el deploy.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint + astro check)
        run: npm run lint

      - name: Tests unitarios + cobertura
        run: npm run test:coverage

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Build de producción
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job de deploy: SOLO corre si `quality` pasó (needs) y solo en push a main.
  # Así garantizamos que a producción nunca llega código que no pasó lint+tests.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy a Vercel (producción)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Traer configuración de producción de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build con Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy a producción
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
